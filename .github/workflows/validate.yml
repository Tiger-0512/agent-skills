name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify reviewed upstream adaptation
        run: >-
          python3 scripts/update-upstream-code-review.py validate
          --manifest skills/standards-spec-review-loop/upstream-code-review.json

      - name: Run unit tests
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m unittest discover -s skills/standards-spec-review-loop/tests -v
          python3 -m unittest discover -s skills/pr-review-response-monitor/tests -v

      - name: Check Python syntax
        run: |
          python3 -m py_compile scripts/update-upstream-code-review.py
          python3 -m py_compile skills/standards-spec-review-loop/scripts/review-loop-state.py
          python3 -m py_compile skills/pr-review-response-monitor/scripts/review-monitor-state.py

      - name: Check whitespace
        run: git diff --check
